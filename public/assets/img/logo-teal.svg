<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 135" width="440" height="135">
  <!-- Transparent background for white/light header -->

  <!-- Oval ellipse border - deep brand teal -->
  <ellipse cx="222" cy="70" rx="192" ry="57" fill="none" stroke="#0d9488" stroke-width="2.5"/>

  <!-- Inner bottom accent stroke -->
  <path d="M 120,108 Q 222,124 324,108" fill="none" stroke="#0f766e" stroke-width="1.5" opacity="0.7"/>

  <!-- Star sparkle LEFT -->
  <g transform="translate(44, 43)">
    <path d="M0,-14 L2.8,-2.8 L14,0 L2.8,2.8 L0,14 L-2.8,2.8 L-14,0 L-2.8,-2.8 Z" fill="#0d9488"/>
  </g>

  <!-- Tiny star near main star LEFT -->
  <g transform="translate(34, 28)">
    <path d="M0,-5.5 L1.1,-1.1 L5.5,0 L1.1,1.1 L0,5.5 L-1.1,1.1 L-5.5,0 L-1.1,-1.1 Z" fill="#14b8a6" opacity="0.9"/>
  </g>

  <!-- Star sparkle RIGHT -->
  <g transform="translate(400, 96)">
    <path d="M0,-11 L2.2,-2.2 L11,0 L2.2,2.2 L0,11 L-2.2,2.2 L-11,0 L-2.2,-2.2 Z" fill="#0d9488"/>
  </g>

  <!-- Tagline "The best choice" - dark teal italic -->
  <text x="222" y="50"
    font-family="Georgia, 'Times New Roman', serif"
    font-style="italic"
    font-size="15.5"
    font-weight="600"
    fill="#0d9488"
    text-anchor="middle"
    letter-spacing="0.8">The best choice</text>

  <!-- Main brand name GODMINTON - deep teal for high contrast on white bg -->
  <text x="222" y="97"
    font-family="Georgia, 'Palatino Linotype', 'Book Antiqua', Palatino, serif"
    font-size="48"
    font-weight="800"
    fill="#0f766e"
    text-anchor="middle"
    letter-spacing="2.5">GODMINTON</text>
</svg>
