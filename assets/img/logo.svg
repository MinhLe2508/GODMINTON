<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 135" width="440" height="135">
  <!-- Transparent background - no fill rect -->

  <!-- Oval ellipse border - light teal, visible on dark navbar -->
  <ellipse cx="222" cy="70" rx="192" ry="57" fill="none" stroke="#2dd4bf" stroke-width="2"/>

  <!-- Inner bottom accent stroke -->
  <path d="M 120,108 Q 222,124 324,108" fill="none" stroke="#14b8a6" stroke-width="1.2" opacity="0.6"/>

  <!-- Star sparkle LEFT -->
  <g transform="translate(44, 43)">
    <path d="M0,-14 L2.8,-2.8 L14,0 L2.8,2.8 L0,14 L-2.8,2.8 L-14,0 L-2.8,-2.8 Z" fill="#2dd4bf"/>
  </g>

  <!-- Tiny star near main star LEFT -->
  <g transform="translate(34, 28)">
    <path d="M0,-5.5 L1.1,-1.1 L5.5,0 L1.1,1.1 L0,5.5 L-1.1,1.1 L-5.5,0 L-1.1,-1.1 Z" fill="#5eead4" opacity="0.8"/>
  </g>

  <!-- Star sparkle RIGHT -->
  <g transform="translate(400, 96)">
    <path d="M0,-11 L2.2,-2.2 L11,0 L2.2,2.2 L0,11 L-2.2,2.2 L-11,0 L-2.2,-2.2 Z" fill="#2dd4bf"/>
  </g>

  <!-- Tagline "The best choice" - light teal italic -->
  <text x="222" y="50"
    font-family="Georgia, 'Times New Roman', serif"
    font-style="italic"
    font-size="15.5"
    font-weight="400"
    fill="#5eead4"
    text-anchor="middle"
    letter-spacing="0.8">The best choice</text>

  <!-- Main brand name GODMINTON - white-ish teal so visible on dark bg -->
  <text x="222" y="97"
    font-family="Georgia, 'Palatino Linotype', 'Book Antiqua', Palatino, serif"
    font-size="48"
    font-weight="700"
    fill="#ccfbf1"
    text-anchor="middle"
    letter-spacing="2.5">GODMINTON</text>
</svg>
